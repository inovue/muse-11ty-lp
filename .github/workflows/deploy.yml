name: Deploy 11ty to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache
          key: eleventy-img-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/img/**') }}
          restore-keys: eleventy-img-${{ hashFiles('package-lock.json') }}-
      - run: npm ci || npm install
      - name: Build with Eleventy (GitHub Pages subpath)
        run: npx eleventy
        env:
          ELEVENTY_PATH_PREFIX: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
